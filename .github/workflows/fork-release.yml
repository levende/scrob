name: Fork Release

on:
  push:
    tags: ['v*-fork*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag, e.g. v2.6.0-fork.2 (required for manual runs)'
        required: true
        type: string
      platforms:
        description: 'Target platforms. Add linux/arm64 only when needed - it is slow (QEMU).'
        required: false
        default: 'linux/amd64'
        type: string

jobs:
  build:
    name: Build & push fork image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    env:
      APP_VERSION: ${{ github.event.inputs.version || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push standard image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ github.event.inputs.platforms || 'linux/amd64' }}
          push: true
          build-args: |
            APP_VERSION=${{ env.APP_VERSION }}
          tags: ghcr.io/${{ github.repository }}:${{ env.APP_VERSION }}
          cache-from: type=gha,scope=fork-release
          cache-to: type=gha,mode=max,scope=fork-release
